name: XHamster Links

on:
  workflow_dispatch:
    inputs:
      url:
        description: "xHamster video URL (one link)"
        required: false
        type: string
      links:
        description: "Multiple links, one per line"
        required: false
        type: string
      proxy:
        description: "Optional override proxy (leave empty to use working_proxies.txt)"
        required: false
        type: string

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          set -e
          pip install -U pip setuptools wheel
          pip install "curl_cffi" "requests" "PySocks"
          pip uninstall -y xhamster_api unofficial-api-for-xhamster eaf_base_api eaf-base-api 2>/dev/null || true
          pip install -U "unofficial-api-for-xhamster"
          python - <<'PY'
          import base_api.base as b
          if not hasattr(b, "setup_logger") and hasattr(b, "get_logger"):
              b.setup_logger = b.get_logger
          from xhamster_api import Client
          print("import OK", Client)
          PY

      - name: Show proxies from repo
        run: |
          if [ -n "${{ inputs.proxy }}" ]; then
            echo "${{ inputs.proxy }}" > working_proxies.txt
            echo "Using manual proxy override"
          fi
          echo "=== working_proxies.txt ==="
          cat working_proxies.txt 2>/dev/null || echo "(missing)"

      - name: Extract quality links
        env:
          URL: ${{ inputs.url }}
          LINKS: ${{ inputs.links }}
          PROXY: ${{ inputs.proxy }}
        run: python xh_links.py

      # No zip artifact — results are in Job Summary + log
