name: XHamster Links

on:
  workflow_dispatch:
    inputs:
      url:
        description: "xHamster video URL"
        required: false
        type: string
      links:
        description: "Multiple links, one per line"
        required: false
        type: string
      proxy:
        description: "Optional single proxy override (socks5://... or http://...)"
        required: false
        type: string
      v2ray_config:
        description: "Xray/V2Ray FULL JSON config (not vmess:// link). Local SOCKS 10808 auto-added."
        required: false
        type: string
      upload:
        description: "Download video on this runner and upload to GitHub Release (true/false)"
        required: false
        default: "true"
        type: string
      quality:
        description: "Preferred quality: best / 1080 / 720 / 480"
        required: false
        default: "best"
        type: string

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          set -e
          pip install -U pip setuptools wheel
          pip install curl_cffi requests PySocks
          pip uninstall -y xhamster_api unofficial-api-for-xhamster 2>/dev/null || true
          pip install -U unofficial-api-for-xhamster
          pip install -U yt-dlp
          python - <<'PY'
          import base_api.base as b
          if not hasattr(b, "setup_logger") and hasattr(b, "get_logger"):
              b.setup_logger = b.get_logger
          from xhamster_api import Client
          print("OK", Client)
          PY
          yt-dlp --version

      - name: Setup Xray from config (optional)
        env:
          V2RAY_CONFIG: ${{ inputs.v2ray_config }}
        run: bash setup_xray.sh

      - name: Prepare proxy list
        run: |
          if [ -n "${{ inputs.proxy }}" ]; then
            echo "${{ inputs.proxy }}" > working_proxies.txt
          fi
          echo "=== working_proxies.txt ==="
          cat working_proxies.txt 2>/dev/null || echo "(none / only xray if started)"

      - name: Extract quality links
        env:
          URL: ${{ inputs.url }}
          LINKS: ${{ inputs.links }}
          PROXY: ${{ inputs.proxy }}
        run: python xh_links.py

      - name: Download + GitHub Release
        if: ${{ inputs.upload == 'true' || inputs.upload == 'True' || inputs.upload == '1' }}
        env:
          UPLOAD: "true"
          QUALITY: ${{ inputs.quality }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          PROXY: ${{ inputs.proxy }}
        run: python download_release.py
