name: XHamster Links

on:
  workflow_dispatch:
    inputs:
      url:
        description: "xHamster video URL (one link)"
        required: false
        type: string
      links:
        description: "Multiple links, one per line"
        required: false
        type: string
      proxy:
        description: "Optional override proxy (leave empty to use working_proxies.txt)"
        required: false
        type: string

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          pip install -U pip setuptools wheel
          # install network stack first, then API (avoids broken base_api extras)
          pip install "curl_cffi" "requests" "PySocks" "beautifulsoup4" "selectolax" "chompjs" "m3u8"
          pip install "eaf_base_api" || pip install "base-api" || true
          pip install -U "xhamster_api" || pip install -U "unofficial-api-for-xhamster"
          python -c "from xhamster_api import Client; print('xhamster_api OK', Client)"

      - name: Show proxies from repo
        run: |
          if [ -n "${{ inputs.proxy }}" ]; then
            echo "${{ inputs.proxy }}" > working_proxies.txt
            echo "Using manual proxy override"
          fi
          echo "=== working_proxies.txt ==="
          if [ -f working_proxies.txt ]; then
            cat working_proxies.txt
          else
            echo "(missing — run Find Free Proxies first)"
          fi

      - name: Extract quality links
        env:
          URL: ${{ inputs.url }}
          LINKS: ${{ inputs.links }}
          PROXY: ${{ inputs.proxy }}
        run: python xh_links.py

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xhamster-links
          path: |
            xh_links.json
            xh_links.txt
