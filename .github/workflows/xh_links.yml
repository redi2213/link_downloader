name: XHamster Links

on:
  workflow_dispatch:
    inputs:
      url:
        description: "xHamster video URL (one link)"
        required: false
        type: string
      links:
        description: "Multiple links, one per line"
        required: false
        type: string
      proxy:
        description: "Optional override proxy (leave empty to use working_proxies.txt from repo)"
        required: false
        type: string

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          pip install -U pip
          pip install requests PySocks
          pip install "xhamster_api" || pip install "unofficial-api-for-xhamster"

      - name: Show proxies from repo
        run: |
          if [ -n "${{ inputs.proxy }}" ]; then
            echo "${{ inputs.proxy }}" > working_proxies.txt
            echo "Using manual proxy override"
          fi
          echo "=== working_proxies.txt ==="
          if [ -f working_proxies.txt ]; then
            cat working_proxies.txt
          else
            echo "(file missing — run Find Free Proxies workflow first)"
          fi

      - name: Extract quality links
        env:
          URL: ${{ inputs.url }}
          LINKS: ${{ inputs.links }}
          PROXY: ${{ inputs.proxy }}
        run: python xh_links.py

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xhamster-links
          path: |
            xh_links.json
            xh_links.txt
