name: XHamster Links

on:
  workflow_dispatch:
    inputs:
      url:
        description: "xHamster video URL (one link)"
        required: false
        type: string
      links:
        description: "Multiple links, one per line"
        required: false
        type: string
      proxy:
        description: "Optional single proxy (socks5://ip:port or http://ip:port). Leave empty to use artifact from Find Free Proxies"
        required: false
        type: string

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          pip install -U pip
          pip install requests PySocks
          pip install "xhamster_api" || pip install "unofficial-api-for-xhamster"

      # Try to pull latest working-proxies artifact from Find Free Proxies workflow
      - name: Download latest free-proxy artifact
        if: ${{ inputs.proxy == '' }}
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: find_proxies.yml
          name: working-proxies
          path: .
          search_artifacts: true
          workflow_conclusion: success
          github_token: ${{ github.token }}

      - name: Show proxy file
        run: |
          if [ -n "${{ inputs.proxy }}" ]; then
            echo "${{ inputs.proxy }}" > working_proxies.txt
            echo "Using manual proxy input"
          fi
          echo "--- working_proxies.txt ---"
          cat working_proxies.txt 2>/dev/null || echo "(no proxy file — will likely fail on GA IPs)"

      - name: Extract quality links
        env:
          URL: ${{ inputs.url }}
          LINKS: ${{ inputs.links }}
          PROXY: ${{ inputs.proxy }}
        run: python xh_links.py

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xhamster-links
          path: |
            xh_links.json
            xh_links.txt
            working_proxies.txt
