name: Find Free Proxies

on:
  workflow_dispatch:
    inputs:
      needed:
        description: "Stop after this many working proxies"
        required: false
        default: "8"
        type: string
      max_candidates:
        description: "Max proxies to test from free lists"
        required: false
        default: "100"
        type: string
      xh_check:
        description: "Also test opening xhamster.com (1=yes, 0=no)"
        required: false
        default: "0"
        type: string

permissions:
  contents: write

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          pip install -U pip
          pip install requests PySocks

      - name: Find working free proxies
        env:
          NEEDED: ${{ inputs.needed }}
          MAX_CANDIDATES: ${{ inputs.max_candidates }}
          XH_CHECK: ${{ inputs.xh_check }}
          PROXY_TIMEOUT: "8"
          MAX_WORKERS: "20"
        run: python find_proxies.py

      - name: Commit working proxies to repo
        run: |
          if [ ! -s working_proxies.txt ]; then
            echo "No working proxies found — skip commit"
            exit 0
          fi

          # Keep a short header so the file is self-explanatory
          {
            echo "# Auto-updated by Find Free Proxies workflow"
            echo "# Updated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "# Format: socks5://ip:port  or  http://ip:port"
            grep -v '^#' working_proxies.txt | sed '/^$/d'
          } > working_proxies.tmp
          mv working_proxies.tmp working_proxies.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add working_proxies.txt working_proxies.json || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore: update working free proxies ($(wc -l < working_proxies.txt | tr -d ' ') lines)"
          git push

      - name: Upload artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: working-proxies
          path: |
            working_proxies.txt
            working_proxies.json
          if-no-files-found: warn
