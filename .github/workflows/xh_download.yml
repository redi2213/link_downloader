name: XHamster Download Release

on:
  workflow_dispatch:
    inputs:
      url:
        description: "xHamster video URL"
        required: true
        type: string
      quality:
        description: "best / 1080 / 720 / 480"
        required: false
        default: "best"
        type: string
      proxy:
        description: "Optional proxy override"
        required: false
        type: string
      v2ray_config:
        description: "Xray/V2Ray FULL JSON config (optional)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          set -e
          pip install -U pip setuptools wheel
          pip install curl_cffi requests PySocks
          pip uninstall -y xhamster_api unofficial-api-for-xhamster 2>/dev/null || true
          pip install -U unofficial-api-for-xhamster
          pip install -U yt-dlp
          yt-dlp --version

      - name: Setup Xray (optional)
        env:
          V2RAY_CONFIG: ${{ inputs.v2ray_config }}
        run: bash setup_xray.sh

      - name: Prepare proxies
        run: |
          if [ -n "${{ inputs.proxy }}" ]; then
            echo "${{ inputs.proxy }}" > working_proxies.txt
          fi
          cat working_proxies.txt 2>/dev/null || true

      - name: Extract links
        env:
          URL: ${{ inputs.url }}
          PROXY: ${{ inputs.proxy }}
        run: python xh_links.py

      - name: Download + GitHub Release
        env:
          UPLOAD: "true"
          QUALITY: ${{ inputs.quality }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          PROXY: ${{ inputs.proxy }}
        run: python download_release.py
